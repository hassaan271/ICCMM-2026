<!-- ICCMM-26 loading screen. Injected into every page by the bootScreen() plugin in vite.config.ts, so it
     paints before the app bundle arrives. A plain screen: IEEE Hyderabad Section logo, conference name and a
     thin progress bar that moves only as real loading milestones finish. It fades out once the page is ready. -->
<style>
  #boot { --p: 0; position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; padding: 24px; color: #14181c;
    background: #f7f9fa; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    transition: opacity 0.5s ease, visibility 0s linear 0.5s; }
  html.no-js #boot { display: none; }
  html.is-booting, html.is-booting body { overflow: hidden; }
  #boot.is-out { opacity: 0; visibility: hidden; }
  .boot-core { display: grid; justify-items: center; gap: 18px; text-align: center; }
  .boot-logo { display: block; height: 64px; width: auto; aspect-ratio: 1600 / 552; mix-blend-mode: multiply; }
  .boot-name { margin: 6px 0 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .boot-name span { color: #0a6fa5; }
  .boot-meta { margin: -8px 0 0; font-size: 0.86rem; color: #646e77; }
  .boot-track { position: relative; width: 180px; height: 3px; margin-top: 6px; border-radius: 3px; background: #e1e6ea; overflow: hidden; }
  .boot-fill { position: absolute; inset: 0; border-radius: inherit; background: #0a6fa5; transform-origin: 0 50%;
    transform: scaleX(calc(0.08 + var(--p) * 0.92)); transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
  @media (max-width: 480px) { .boot-logo { height: 52px; } .boot-name { font-size: 1.4rem; } }
  @media (prefers-reduced-motion: reduce) { #boot, .boot-fill { transition: none; } }
</style>
<div id="boot" role="status" aria-live="polite" aria-label="Loading ICCMM-26">
  <div class="boot-core">
    <img class="boot-logo" src="assets/logos/logo-ieee-hyderabad-section-charminar.jpg" width="1600" height="552" alt="IEEE Hyderabad Section" decoding="async" fetchpriority="high" />
    <p class="boot-name">ICCMM<span>-26</span></p>
    <p class="boot-meta">20–21 November 2026 · MJCET, Hyderabad</p>
    <div class="boot-track" aria-hidden="true"><span class="boot-fill"></span></div>
  </div>
</div>
<script>
  (function () {
    var boot = document.getElementById('boot');
    var html = document.documentElement;
    if (!boot) return;
    html.classList.add('is-booting');
    // Real milestones only: the bar moves when one finishes; nothing is simulated.
    var tasks = ['fonts', 'app', 'media'];
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var minShow = reduced ? 0 : 400;
    var done = {}, finishing = false, t0 = performance.now();
    function render() {
      var n = 0;
      for (var i = 0; i < tasks.length; i++) if (done[tasks[i]]) n++;
      boot.style.setProperty('--p', (n / tasks.length).toFixed(3));
      return n === tasks.length;
    }
    function finish() {
      if (finishing) return;
      finishing = true;
      for (var i = 0; i < tasks.length; i++) done[tasks[i]] = true;
      render();
      setTimeout(function () {
        boot.classList.add('is-out');
        html.classList.remove('is-booting');
        window.__bootDone = true;
        window.dispatchEvent(new Event('iccmm:boot-done'));
        setTimeout(function () { boot.remove(); }, 600);
      }, Math.max(reduced ? 0 : 250, minShow - (performance.now() - t0)));
    }
    function mark(id) {
      if (done[id] || finishing) return;
      done[id] = true;
      // Once the app runs, don't wait long for slow images
      if (id === 'app') setTimeout(finish, 1200);
      if (render()) finish();
    }
    render();
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { mark('fonts'); });
    window.addEventListener('iccmm:app', function () { mark('app'); });
    if (document.readyState === 'complete') mark('media'); else window.addEventListener('load', function () { mark('media'); });
    if (window.__iccmmReady) mark('app');
    setTimeout(finish, 6000); // failsafe: never hold the page
  })();
</script>
